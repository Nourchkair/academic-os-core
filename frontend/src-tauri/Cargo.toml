[package]
name = "academia-os-desktop"
version = "0.4.0"
description = "Local Academia OS desktop shell"
authors = ["Academia OS contributors"]
edition = "2021"

[lib]
name = "academia_os_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
