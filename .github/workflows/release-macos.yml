name: macOS app release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package, for example v0.5.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.arch }} macOS app
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: Apple Silicon
            runner: macos-26
          - arch: Intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the local Academia runtime and bundler
        run: python -m pip install -e ".[desktop-build]"
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Configure signed update verification
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY || secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: python scripts/configure_tauri_updater.py
      - name: Check version metadata
        run: python scripts/check_versions.py
      - name: Require the tag to match the app version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from academia_os.version import __version__
          expected = f"v{__version__}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} does not match current app version {expected!r}.")
          PY
      - name: Import the Academia beta code-signing identity
        id: beta-sign
        env:
          ACADEMIA_BETA_SIGNING_P12_B64: ${{ secrets.ACADEMIA_BETA_SIGNING_P12_B64 }}
          ACADEMIA_BETA_SIGNING_P12_PASSWORD: ${{ secrets.ACADEMIA_BETA_SIGNING_P12_PASSWORD }}
        run: bash scripts/install_beta_signing_identity.sh
      - uses: tauri-apps/tauri-action@v0.5.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ steps.beta-sign.outputs.identity }}
          ACADEMIA_GOOGLE_OAUTH_CLIENT_JSON_B64: ${{ secrets.ACADEMIA_GOOGLE_OAUTH_CLIENT_JSON_B64 }}
          ACADEMIA_REQUIRE_GOOGLE_CLIENT: "1"
        with:
          projectPath: frontend
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: AcademiaOS ${{ inputs.release_tag || github.ref_name }}
          releaseBody: AcademiaOS beta DMGs and signed in-app update artifacts. The app is not notarized; first launch may require a Gatekeeper approval.
          # Keep the release unpublished until the signed bundled CLI has
          # started successfully on both macOS architectures.
          releaseDraft: true
          # Build the DMG installer and Tauri's signed .app updater archive.
          args: --bundles dmg,app
          assetNamePattern: '[name]_[arch]_[platform].[ext]'
      - name: Verify the signed bundled CLI reads a workspace
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find frontend/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "Tauri did not produce a macOS disk image" >&2
            exit 1
          fi

          # Tauri removes its temporary .app bundle after packaging. Mount and
          # exercise the exact signed app that will be delivered in the DMG.
          mount_point="$(mktemp -d "${RUNNER_TEMP:-/tmp}/academia-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_point" -quiet || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point"

          cli="$mount_point/AcademiaOS.app/Contents/MacOS/academia"
          if [ ! -x "$cli" ]; then
            echo "The signed Academia CLI is missing from the packaged DMG" >&2
            exit 1
          fi
          python scripts/smoke_macos_sidecar.py "$cli"
      - name: Remove the temporary beta signing keychain
        if: always() && steps.beta-sign.outputs.keychain-path != ''
        env:
          KEYCHAIN_PATH: ${{ steps.beta-sign.outputs.keychain-path }}
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

  publish:
    name: Publish verified macOS release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify both signed updater targets are available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          manifest_dir="$RUNNER_TEMP/academia-updater-manifest"
          mkdir -p "$manifest_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir "$manifest_dir"
          manifest="$manifest_dir/latest.json"
          expected_version="${RELEASE_TAG#v}"
          python scripts/encode_updater_signatures.py "$manifest"
          gh release upload "$RELEASE_TAG" "$manifest" \
            --repo "$GITHUB_REPOSITORY" --clobber
          jq -e --arg version "$expected_version" '
            .version == $version and
            .platforms["darwin-aarch64"].url != null and
            .platforms["darwin-aarch64"].signature != null and
            .platforms["darwin-x86_64"].url != null and
            .platforms["darwin-x86_64"].signature != null
          ' "$manifest" >/dev/null

      - name: Publish the draft release after both architectures pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
